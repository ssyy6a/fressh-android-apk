name: Convert AAB to arm64 APK

on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "URL of the official Fressh AAB (empty = default 0.1.1)"
        required: false
        default: ""
      create_release:
        description: "Create a GitHub Release with the APK?"
        required: false
        type: boolean
        default: true
      tag_name:
        description: "Release tag (e.g. v0.1.1-arm64)"
        required: false
        default: "v0.1.1-arm64"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT use android-actions/setup-android — it tries to install obsolete package "tools"
      # and fails with: Failed to find package 'tools'
      - name: Install Android build-tools (zipalign + apksigner)
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$ANDROID_HOME/cmdline-tools" ]]; then
            # Fallback: minimal cmdline-tools if runner image has none
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          # Prefer whichever sdkmanager exists
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            for p in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              [[ -x "$p" ]] && SDKMANAGER="$p" && break
            done
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;34.0.0"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$BT" >> "$GITHUB_ENV"
          echo "Installed build-tools at $BT"

      - name: Make script executable
        run: chmod +x scripts/convert.sh

      - name: Convert AAB → arm64-v8a release APK
        env:
          KEYSTORE_PASS: fressh-sideload
          KEY_PASS: fressh-sideload
          KEY_ALIAS: fressh
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.aab_url }}" ]; then
            ./scripts/convert.sh "${{ inputs.aab_url }}"
          else
            ./scripts/convert.sh
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fressh-arm64-v8a-release
          path: out/fressh-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Fressh arm64-v8a release APK (${{ inputs.tag_name }})
          body: |
            Unofficial **arm64-v8a only** APK converted from the official Fressh AAB.

            - Source: https://github.com/EthanShoeDev/fressh
            - Only `lib/arm64-v8a` is kept
            - Signed with a release-style keystore (sideload only; not Play Store key)
            - Prefer official closed testing when possible: https://fressh.dev/

            **Not affiliated with the Fressh authors.**
          files: out/fressh-arm64-v8a-release.apk
          draft: false
          prerelease: true
