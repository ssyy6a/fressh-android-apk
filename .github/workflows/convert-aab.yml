name: Convert AAB to arm64 APK

on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "URL of the official Fressh AAB (empty = default 0.1.1)"
        required: false
        default: ""
      create_release:
        description: "Create a GitHub Release with the APK?"
        required: false
        type: boolean
        default: true
      tag_name:
        description: "Release tag (e.g. v0.1.1-arm64)"
        required: false
        default: "v0.1.1-arm64"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools (zipalign + apksigner)
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install build-tools
        run: |
          sdkmanager --install "build-tools;34.0.0"
          # Expose for the script
          echo "BUILD_TOOLS_DIR=${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Make script executable
        run: chmod +x scripts/convert.sh

      - name: Convert AAB → arm64-v8a release APK
        env:
          # Optional: set these as repo secrets for a stable signing key across releases
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'fressh-sideload' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'fressh-sideload' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'fressh' }}
        run: |
          if [ -n "${{ inputs.aab_url }}" ]; then
            ./scripts/convert.sh "${{ inputs.aab_url }}"
          else
            ./scripts/convert.sh
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fressh-arm64-v8a-release
          path: out/fressh-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Fressh arm64-v8a release APK (${{ inputs.tag_name }})
          body: |
            Unofficial **arm64-v8a only** APK converted from the official Fressh AAB.

            - Source: https://github.com/EthanShoeDev/fressh
            - Only `lib/arm64-v8a` is kept (smaller than universal)
            - Signed with a release-style keystore (sideload; **not** the Play Store key)
            - Prefer official closed testing when possible: https://fressh.dev/

            **Not affiliated with the Fressh authors.**
          files: out/fressh-arm64-v8a-release.apk
          draft: false
          prerelease: true
